name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Get Dependencies
        run: |
          # Khởi tạo đầy đủ cấu trúc Xcode Project chuẩn với tên package chữ thường
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          flutter pub get

      - name: Build iOS App (.app Payload)
        run: |
          flutter build ios --release --no-codesign

      - name: Package into LoveDay.ipa
        run: |
          rm -rf Payload LoveDay.ipa dist
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r LoveDay.ipa Payload
          mkdir -p dist
          mv LoveDay.ipa dist/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
