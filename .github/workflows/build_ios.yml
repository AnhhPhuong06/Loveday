name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Dependencies
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Patch Xcode Project Configurations for No-CodeSign
        run: |
          python3 -c "
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          # Thiet lap DevelopmentTeam de thoa man Flutter CLI nhung tat bat buoc ky ma cua Xcode
          patch = '''CODE_SIGN_STYLE = Manual;
          \t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;
          \t\t\t\tCODE_SIGNING_ALLOWED = NO;
          \t\t\t\tCODE_SIGNING_REQUIRED = NO;
          \t\t\t\tCODE_SIGN_IDENTITY = \"\";
          \t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";'''
          
          content = content.replace('CODE_SIGN_STYLE = Automatic;', patch)
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          "
          
          mkdir -p ios/Flutter
          cat << 'EOF' > ios/Flutter/Release.xcconfig
          #include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          #include "Generated.xcconfig"
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ABCDE12345
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF

      - name: Build iOS Release App with Flutter
        run: |
          # Flutter se tu dong thiet lap day du FLUTTER_ROOT, bien dich Dart Release va tao Runner.app
          flutter build ios --release --no-codesign

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Tìm kiếm Runner.app trong build folder..."
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app!"
            find build -maxdepth 6 || true
            exit 1
          fi
          
          echo "✅ Tìm thấy Runner.app tại: $APP_PATH"
          du -sh "$APP_PATH"
          
          # Copy Runner.app vào thư mục Payload
          cp -r "$APP_PATH" Payload/
          
          # Đóng gói zip chuẩn cấu trúc IPA cho iOS
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Kích thước file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # Kiểm tra dung lượng hợp lệ (phải lớn hơn 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
