name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Configure Team ID
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          # Đặt Development Team hợp lệ (10 ký tự) để vượt qua bước xác thực của Flutter CLI
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DevelopmentTeam = ABCDE12345;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "ABCDE12345";/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release App (.app)
        run: |
          # Biên dịch toàn bộ mã nguồn Dart và iOS Native thành công
          flutter build ios --release --no-codesign

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          
          # Copy Runner.app vào thư mục Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # Đóng gói zip chuẩn cấu trúc IPA cho iOS
          zip -r LoveDay.ipa Payload
          mv LoveDay.ipa dist/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
