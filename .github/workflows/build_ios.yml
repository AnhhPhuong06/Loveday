name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & CocoaPods
        run: |
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build iOS App (.app with Code Signing Disabled)
        run: |
          # Build Flutter Assets & Config
          flutter build ios --release --no-codesign --config-only
          
          # Biên dịch trực tiếp qua xcodebuild bỏ qua Development Team
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into LoveDay.ipa
        run: |
          rm -rf Payload LoveDay.ipa dist
          mkdir -p Payload
          cp -r build/ios_build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r LoveDay.ipa Payload
          mkdir -p dist
          mv LoveDay.ipa dist/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
