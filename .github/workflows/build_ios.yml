name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Dependencies
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Patch Xcode Configuration for Unsigned Build
        run: |
          python3 -c "
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          patch = '''CODE_SIGN_STYLE = Manual;
          \t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;
          \t\t\t\tCODE_SIGNING_ALLOWED = NO;
          \t\t\t\tCODE_SIGNING_REQUIRED = NO;
          \t\t\t\tCODE_SIGN_IDENTITY = \"\";
          \t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";'''
          
          content = content.replace('CODE_SIGN_STYLE = Automatic;', patch)
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          "
          
          mkdir -p ios/Flutter
          cat << 'EOF' > ios/Flutter/Release.xcconfig
          #include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          #include "Generated.xcconfig"
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ABCDE12345
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF

      - name: Compile iOS Release App
        run: |
          # Biên dịch toàn bộ Dart AOT + Native Swift
          flutter build ipa --no-codesign || flutter build ios --release --no-codesign || true

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          echo "🔍 Tìm kiếm Runner.app trong thư mục build và DerivedData..."
          
          APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app! Kiểm tra danh sách build:"
            find build -maxdepth 6 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Tìm thấy Runner.app tại: $APP_PATH"
          echo "📊 Dung lượng ứng dụng đã biên dịch:"
          du -sh "$APP_PATH"
          
          # Sao chép vào thư mục Payload chuẩn của iOS IPA
          cp -r "$APP_PATH" Payload/
          
          # Ký ad-hoc
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Nén Payload thành LoveDay.ipa
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Thông tin file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # Kiểm tra dung lượng hợp lệ (> 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          echo "Dung lượng chính xác: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
