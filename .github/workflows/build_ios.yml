name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configure Git and Environment Permissions
        run: |
          git config --global --add safe.directory "*"
          sudo ln -sf $(which flutter) /usr/local/bin/flutter || true
          sudo ln -sf $(which dart) /usr/local/bin/dart || true

      - name: Prepare iOS Native Project & Pods
        run: |
          # 1. Tạo scaffold nếu cần
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # 2. Tạo Podfile chuẩn iOS 14
          cat << 'EOF' > ios/Podfile
          platform :ios, '14.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {'Debug' => :debug, 'Profile' => :release, 'Release' => :release}
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          EOF
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Patch Xcode Project for Unsigned Release
        run: |
          python3 -c "
          import re
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          injection = '''buildSettings = {
          \t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;
          \t\t\t\tENABLE_USER_SCRIPT_SANDBOXING = NO;
          \t\t\t\tCODE_SIGN_STYLE = Manual;
          \t\t\t\tCODE_SIGNING_ALLOWED = NO;
          \t\t\t\tCODE_SIGNING_REQUIRED = NO;
          \t\t\t\tCODE_SIGN_IDENTITY = \"\";
          \t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";'''
          
          content = re.sub(r'buildSettings = \{', injection, content)
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          "
          
          echo "ENABLE_USER_SCRIPT_SANDBOXING=NO" >> ios/Flutter/Generated.xcconfig
          echo "ENABLE_USER_SCRIPT_SANDBOXING=NO" >> ios/Flutter/Release.xcconfig

      - name: Build iOS Release App with Flutter CLI
        run: |
          # Flutter CLI biên dịch toàn bộ Dart Release và Xcode
          flutter build ios --release --no-codesign || true

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          # Tìm Runner.app đã biên dịch đầy đủ dung lượng
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ] && [ "$(du -sk build/ios/iphoneos/Runner.app | cut -f1)" -gt 1000 ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ] && [ "$(du -sk build/ios/Release-iphoneos/Runner.app | cut -f1)" -gt 1000 ]; then
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
          else
            echo "🔍 Đang tìm kiếm Runner.app trong DerivedData..."
            APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app!"
            find /Users/runner/Library/Developer/Xcode/DerivedData build -maxdepth 6 || true
            exit 1
          fi
          
          echo "✅ Đã tìm thấy Runner.app đầy đủ tại: $APP_PATH"
          echo "📊 Kích thước gói ứng dụng:"
          du -sh "$APP_PATH"
          
          # Sao chép vào Payload
          cp -r "$APP_PATH" Payload/
          
          # Ký Ad-hoc để tương thích Sideloadly / TrollStore
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Nén thành LoveDay.ipa
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Kích thước file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # Xác thực dung lượng thực (> 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          echo "Dung lượng chính xác: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
