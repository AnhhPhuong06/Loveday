name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Dependencies
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Compile iOS App with Flutter
        run: |
          # Biên dịch toàn bộ Dart AOT + Native Swift
          flutter build ios --release --no-codesign || true

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist
          rm -rf Payload
          mkdir -p Payload
          
          echo "🔍 Tìm kiếm Runner.app trong DerivedData và Build directory..."
          
          # Quét cả DerivedData của Xcode và build folder
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData /Users/runner/Library/Developer/Xcode/DerivedData build -name "Runner.app" -type d 2>/dev/null | grep -i "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData /Users/runner/Library/Developer/Xcode/DerivedData build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app!"
            find ~/Library/Developer/Xcode/DerivedData build -maxdepth 6 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Tìm thấy Runner.app tại: $APP_PATH"
          du -sh "$APP_PATH"
          
          # Copy Runner.app vào Payload
          cp -r "$APP_PATH" Payload/
          
          # Ký ad-hoc để đảm bảo cấu trúc bundle hợp lệ
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Đóng gói zip chuẩn iOS IPA
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Kích thước file IPA thực tế:"
          ls -lh dist/LoveDay.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
