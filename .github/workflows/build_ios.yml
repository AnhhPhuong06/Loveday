name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Symlink Flutter Binary to System Path
        run: |
          # Đảm bảo Xcode Run Script luôn tìm thấy lệnh flutter và dart
          sudo ln -sf $(which flutter) /usr/local/bin/flutter || true
          sudo ln -sf $(which dart) /usr/local/bin/dart || true

      - name: Prepare iOS Project & Dependencies
        run: |
          # 1. Tạo scaffold nếu cần
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # 2. Tạo Podfile chuẩn iOS 14
          cat << 'EOF' > ios/Podfile
          platform :ios, '14.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {'Debug' => :debug, 'Profile' => :release, 'Release' => :release}
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['DEVELOPMENT_TEAM'] = 'ABCDE12345'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          EOF
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Configure Xcode Project for Unsigned Archive
        run: |
          python3 -c "
          import re
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          # Tiêm Team ID va tat Sandboxing vao tat ca cac block buildSettings
          injection = '''buildSettings = {
          \t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;
          \t\t\t\tENABLE_USER_SCRIPT_SANDBOXING = NO;
          \t\t\t\tCODE_SIGN_STYLE = Manual;
          \t\t\t\tCODE_SIGNING_ALLOWED = NO;
          \t\t\t\tCODE_SIGNING_REQUIRED = NO;
          \t\t\t\tCODE_SIGN_IDENTITY = \"\";
          \t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";'''
          
          content = re.sub(r'buildSettings = \{', injection, content)
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          "
          
          mkdir -p ios/Flutter
          cat << 'EOF' > ios/Flutter/Release.xcconfig
          #include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          #include "Generated.xcconfig"
          DEVELOPMENT_TEAM = ABCDE12345
          ENABLE_USER_SCRIPT_SANDBOXING = NO
          CODE_SIGN_STYLE = Manual
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          
          echo "ENABLE_USER_SCRIPT_SANDBOXING=NO" >> ios/Flutter/Generated.xcconfig

      - name: Build iOS IPA Package with Flutter
        run: |
          # Su dung lenh chinh thuc flutter build ipa --no-codesign
          flutter build ipa --no-codesign --release

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          # 1. Tìm kiếm Runner.app trong build archive
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            echo "✅ Tìm thấy Runner.app trong Runner.xcarchive!"
            cp -r "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" Payload/
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "✅ Tìm thấy Runner.app trong build/ios/iphoneos!"
            cp -r "build/ios/iphoneos/Runner.app" Payload/
          else
            echo "Tìm kiếm Runner.app trong toàn bộ thư mục build..."
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
            cp -r "$APP_PATH" Payload/
          fi
          
          if [ ! -d "Payload/Runner.app" ]; then
            echo "❌ Không thể sao chép Runner.app!"
            find build -maxdepth 6 || true
            exit 1
          fi
          
          echo "📊 Kích thước Runner.app thực tế:"
          du -sh Payload/Runner.app
          
          # 2. Ký Ad-hoc để tương thích Sideloadly / TrollStore
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # 3. Đóng gói zip chuẩn cấu trúc IPA
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Thông tin file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # 4. Kiểm tra dung lượng hợp lệ (> 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          echo "Dung lượng chính xác: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
