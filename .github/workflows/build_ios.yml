name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Dependencies
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release App with Xcodebuild
        run: |
          # 1. Export biến môi trường Flutter cần thiết cho xcode_backend.sh
          export FLUTTER_ROOT="/Users/runner/hostedtoolcache/flutter/stable-3.24.0-arm64/flutter"
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          export DART_OBFUSCATION=false
          export TRACK_WIDGET_CREATION=true
          export TREE_SHAKE_ICONS=false
          export PACKAGE_CONFIG=".dart_tool/package_config.json"
          
          # 2. Biên dịch trước Flutter Release Bundle
          flutter build bundle --release
          
          # 3. Biên dịch hoàn tất 100% bằng xcodebuild với SYMROOT cố định
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build/ios" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Tìm kiếm Runner.app trong build..."
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app!"
            find build -maxdepth 6 || true
            exit 1
          fi
          
          echo "✅ Đã tìm thấy Runner.app tại: $APP_PATH"
          echo "📊 Danh sách file bên trong Runner.app:"
          ls -la "$APP_PATH"
          du -sh "$APP_PATH"
          
          # Copy toàn bộ Runner.app vào thư mục Payload
          cp -r "$APP_PATH" Payload/
          
          # Ký ad-hoc
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Đóng gói zip chuẩn cấu trúc IPA
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Thông tin file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # Kiểm tra dung lượng hợp lệ (> 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          echo "Dung lượng chính xác: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
