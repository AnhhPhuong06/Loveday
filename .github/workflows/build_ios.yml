name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configure Git and System Symlinks
        run: |
          git config --global --add safe.directory "*"
          sudo ln -sf $(which flutter) /usr/local/bin/flutter || true
          sudo ln -sf $(which dart) /usr/local/bin/dart || true

      - name: Setup Flutter Frameworks & CocoaPods
        run: |
          # 1. Tạo scaffold iOS
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # 2. Sinh sẵn Flutter.framework và GeneratedPluginRegistrant
          flutter build ios --config-only --no-codesign
          
          # 3. Tạo Podfile chuẩn iOS 14
          cat << 'EOF' > ios/Podfile
          platform :ios, '14.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {'Debug' => :debug, 'Profile' => :release, 'Release' => :release}
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          EOF
          
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Xcode Release Archive
        run: |
          FLUTTER_SDK_DIR="$(which flutter | sed 's/\/bin\/flutter//')"
          
          # Cấu hình Release.xcconfig
          cat << EOF > ios/Flutter/Release.xcconfig
          #include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          #include "Generated.xcconfig"
          FLUTTER_ROOT=${FLUTTER_SDK_DIR}
          FLUTTER_APPLICATION_PATH=${PWD}
          FLUTTER_TARGET=lib/main.dart
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=1.0.0
          FLUTTER_BUILD_NUMBER=1
          ENABLE_USER_SCRIPT_SANDBOXING=NO
          CODE_SIGN_STYLE=Manual
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          PROVISIONING_PROFILE_SPECIFIER=
          EOF
          
          # Biên dịch trực tiếp tạo file LoveDay.xcarchive hoàn chỉnh
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LoveDay.xcarchive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          APP_PATH="build/LoveDay.xcarchive/Products/Applications/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "🔍 Tìm kiếm Runner.app trong thư mục build archive..."
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app!"
            find build -maxdepth 6 || true
            exit 1
          fi
          
          echo "✅ Đã tìm thấy Runner.app hoàn chỉnh tại: $APP_PATH"
          echo "📊 Kích thước gói ứng dụng:"
          du -sh "$APP_PATH"
          
          # Copy toàn bộ Runner.app vào thư mục Payload chuẩn iOS
          cp -r "$APP_PATH" Payload/
          
          # Ký Ad-hoc để tương thích Sideloadly / TrollStore
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Nén Payload thành LoveDay.ipa
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Kích thước file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # Kiểm tra dung lượng hợp lệ (> 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          echo "Dung lượng chính xác: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
