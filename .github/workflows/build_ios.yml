name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & CocoaPods
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          # Chuyển đổi Signing sang Manual trong Xcode project
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DevelopmentTeam = [^;]*;/DevelopmentTeam = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Compile Release Bundle & Build IPA with Xcode
        run: |
          # 1. Build Flutter Dart Release Bundle
          flutter build bundle --release
          
          # 2. Biên dịch trực tiếp qua xcodebuild bỏ qua Provisioning Profile
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          rm -rf Payload/*
          
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Tìm kiếm Runner.app trong DerivedData..."
            APP_PATH=$(find build/DerivedData -name "Runner.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app!"
            find build -maxdepth 6 || true
            exit 1
          fi
          
          echo "✅ Tìm thấy Runner.app tại: $APP_PATH"
          du -sh "$APP_PATH"
          
          # Copy Runner.app vào thư mục Payload
          cp -r "$APP_PATH" Payload/
          
          # Ký ad-hoc để đảm bảo cấu trúc bundle hợp lệ
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Đóng gói zip chuẩn cấu trúc IPA cho iOS
          zip -r dist/LoveDay.ipa Payload
          
          echo "🎉 Kích thước file IPA hoàn thiện:"
          ls -lh dist/LoveDay.ipa
          
          # Kiểm tra dung lượng hợp lệ (phải lớn hơn 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA dung lượng không hợp lệ ($FILE_SIZE bytes)!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
