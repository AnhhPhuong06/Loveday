name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Dependencies
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          # Gán DevelopmentTeam & Manual Signing cho toàn bộ project
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "ABCDE12345";/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Flutter Release Bundle & Native Archive
        run: |
          # 1. Build Flutter Dart Release Bundle
          flutter build bundle --release
          
          # 2. Archive bằng xcodebuild trực tiếp không cần chứng chỉ
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/LoveDay.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="ABCDE12345" \
            archive

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist
          rm -rf Payload
          mkdir -p Payload
          
          # Tìm Runner.app trong archive
          APP_PATH="build/LoveDay.xcarchive/Products/Applications/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Tìm kiếm Runner.app trong toàn bộ thư mục build..."
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app trong build archive!"
            find build -maxdepth 6 || true
            exit 1
          fi
          
          echo "✅ Tìm thấy Runner.app tại: $APP_PATH"
          du -sh "$APP_PATH"
          
          # Copy Runner.app vào thư mục Payload
          cp -r "$APP_PATH" Payload/
          
          # Ký ad-hoc để đảm bảo cấu trúc bundle hợp lệ
          codesign --force --deep --sign - Payload/Runner.app || true
          
          # Nén toàn bộ thư mục Payload thành file LoveDay.ipa chuẩn
          zip -r dist/LoveDay.ipa Payload
          
          # Kiểm tra dung lượng thực tế của IPA (phải > 5MB)
          FILE_SIZE=$(wc -c < dist/LoveDay.ipa)
          echo "🎉 Kích thước file IPA: $FILE_SIZE bytes"
          ls -lh dist/LoveDay.ipa
          
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "❌ File IPA quá nhỏ, kiểm tra lại nội dung!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
