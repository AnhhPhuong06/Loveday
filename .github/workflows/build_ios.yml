name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Scaffold & Dependencies
        run: |
          # Backup cấu hình tùy biến
          cp ios/Podfile /tmp/Podfile.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          
          flutter create --project-name loveday --platforms=ios --org com.loveday.app .
          
          # Khôi phục Podfile & Info.plist
          cp /tmp/Podfile.bak ios/Podfile 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Compile iOS Release Bundle
        run: |
          # Flutter biên dịch toàn bộ Dart AOT + Native Swift vào build/ios/iphoneos/Runner.app
          flutter build ios --release --no-codesign || true

      - name: Package Payload into LoveDay.ipa
        run: |
          mkdir -p dist Payload
          
          # Kiểm tra file Runner.app đã biên dịch xong
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "✅ Da tim thay Runner.app bien dich thanh cong!"
            
            # Ký ad-hoc để tương thích hoàn toàn với Sideloadly / TrollStore / Scarlet
            codesign --force --deep --sign - build/ios/iphoneos/Runner.app || true
            
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r LoveDay.ipa Payload
            mv LoveDay.ipa dist/
            echo "🎉 Dong goi LoveDay.ipa thanh cong!"
          else
            echo "❌ Khong tim thay Runner.app, kiem tra thu muc build:"
            find build -maxdepth 4 || true
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDay-iOS-IPA
          path: dist/LoveDay.ipa
          retention-days: 7
