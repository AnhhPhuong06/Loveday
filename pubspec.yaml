name: loveday
description: "LoveDay - Ung dung tinh yeu toan dien: Dem ngay yeu, Chuoi anh Streak, Chu ky kinh nguyet, Chat 1-1 & Doi Icon App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Icons & UI Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  table_calendar: ^3.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend 0d (Supabase Serverless)
  supabase_flutter: ^2.5.6

  # Social Logins (Google, Apple, Facebook)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^7.1.1

  # Locket & TikTok Features (Camera, Image, Dynamic Icon, Widget)
  camera: ^0.10.5+9
  image_picker: ^1.1.0
  flutter_dynamic_icon_plus: ^1.2.0
  home_widget: ^0.6.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/stickers/
